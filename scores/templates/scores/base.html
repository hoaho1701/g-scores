<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}G-Scores{% endblock %} | G-Scores</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Rubik", sans-serif; background-color: #f5f7fb; }
    .page-title { font-weight: 700; }
    .chart-box { position: relative; height: 420px; }
    @media (max-width: 576px) { .chart-box { height: 340px; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'scores:lookup' %}">G-Scores</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Mở menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        {% with current=request.resolver_match.url_name %}
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link{% if current == 'lookup' %} active fw-bold{% endif %}"
               {% if current == 'lookup' %}aria-current="page"{% endif %}
               href="{% url 'scores:lookup' %}">Tra cứu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if current == 'report' %} active fw-bold{% endif %}"
               {% if current == 'report' %}aria-current="page"{% endif %}
               href="{% url 'scores:report' %}">Báo cáo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if current == 'top10' %} active fw-bold{% endif %}"
               {% if current == 'top10' %}aria-current="page"{% endif %}
               href="{% url 'scores:top10' %}">Top 10 khối A</a>
          </li>
        </ul>
        {% endwith %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container pb-4 text-center text-muted small">
    Dữ liệu: điểm thi THPT quốc gia 2024
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
