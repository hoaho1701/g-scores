services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gscores
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gscores"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:pass@db:5432/gscores
      SECRET_KEY: change-me-in-production
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && gunicorn config.wsgi --bind 0.0.0.0:8000"

volumes:
  pgdata:
